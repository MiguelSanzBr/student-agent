# Fonte única dos números operacionais.
# Metas, TTFE e orçamento: fórmula pré-registrada (evals/latency/formula.py). As metas começaram com
# PRIORS do gemini-3.8-flash (docs/evidence/spikes.md, histórico); o reajuste único veio da janela A
# real com claude-haiku-5-5 (2026-11-04) e o arquivo está congelado: não há segundo reajuste.
# p99 abaixo do p95 vem da regra pré-registrada max(meta inicial, previsto): é indicativo.
# est_requests, est_tokens e turn_usage: medidos em 2026-11-04 (janela B e sondas de
# debug.usage, docs/evidence/quality/notes.md); não mexem nas metas de latência.
frozen: true
quotas:  # PROVISÓRIO: cotas reais (RPM/TPM/RPD) pendentes, sem GEMINI_API_KEY
  gemini-3.8-flash: {rpm: 1000, tpm: 1000000, rpd: 10000}
  gemini-3.5-flash-lite: {rpm: 4000, tpm: 4000000, rpd: 50000}
  # PROVISÓRIO: limites reais dependem do tier da conta
  claude-opus-5-5: {rpm: 1000, tpm: 1000000, rpd: 10000}
  claude-sonnet-5-5: {rpm: 1000, tpm: 1000000, rpd: 10000}
  claude-haiku-5-5: {rpm: 10000, tpm: 6000000, rpd: 14400000}  # cabeçalhos anthropic-ratelimit-* da conta do autor (2026-11-04); sem limite diário: rpd = rpm × 1440
  gpt-6.1-terra: {rpm: 1000, tpm: 1000000, rpd: 10000}
  gpt-6-luna: {rpm: 1000, tpm: 1000000, rpd: 10000}
admission:
  quota_fraction: 0.9
  est_requests: 2  # E[chamadas ao LLM por turno]: 2,03 na janela B, 1,97 na C
  est_tokens: 14500  # E[tokens por turno]: ~13,5 mil de entrada + ~1 mil de saída e raciocínio
components:  # reajuste único da janela A (2026-11-04, claude-haiku-5-5, n=answer_call 390/overhead 300/tool_call 215)
  tool_call: {mu: 0.3475, sigma: 0.229}
  answer_call: {mu: 0.7234, sigma: 0.2724}
  overhead: {mu: -3.1075, sigma: 0.3681}
hedge:  # alavanca lever_hedge_first_call (app/agent/levers.py): só dispara dentro deste orçamento
  quantile: 0.9  # da 1ª chamada do turno
  card_share: 0.45  # premissa do hedge (alavanca desligada); a janela B mediu 0,24 de turnos `card`
  max_fraction: 0.10  # hedges/min <= 10% das chamadas
  floor_per_min: 3
  bucket_max_util: 0.8  # sem hedge com o balde de admissão acima de 80%
model_constants:  # premissas fora dos componentes; testes amarram os módulos a estes valores
  turn_usage: {input: 13500, output: 500, thinking: 400}  # turno médio medido (capacity.monthly_cost)
  ladder_a: {plateau: 0.9, p95_factor: 1.1, retry_max: 0.10, cut_max: 0.005}
  initial_targets: {card: {p50: 3.5, p95: 6.0}, "1": {p95: 8.0, ttfe_p95: 4.0}, "2+": {p95: 12.0, ttfe_p95: 4.0}}
  k_tools: {card: [0], "1": [1], "2+": [2, 2, 3, 4]}
  p_guard_retry: 0.05
limits:  # plano, Global Constraints (Limites); perfil escolhido por LIMITS_PROFILE
  default: &limits_default
    input_chars: 2000
    answer_chars: 2000
    msgs_per_min: 20
    tokens_per_day: 200000
    global_ceiling_usd: 20  # demo
    history_turns: 5
    history_ttl_s: 1800
    jwt_ttl_s: 1800
    draft_ttl_s: 600
    login_ticket_ttl_s: 300
    a2a_task_ttl_s: 3600
    max_rounds: 4
    degrade_at: 0.8  # >= 80% do teto: degrade_rounds e sem retry do guard; 100%: 503
    degrade_rounds: 2
    turns_in_flight: 2  # por aluno; as vagas (turn_slots) são globais
  eval:  # sem degradação por custo; o teto duro aborta a rodada
    <<: *limits_default
    tokens_per_day: 5000000  # alunos sintéticos fazem dezenas de turnos/dia; o teto de gasto protege
    global_ceiling_usd: 40
    degrade_at: null
  load:  # só no teste de carga (LLM_PROVIDER=loadtest): sem limite por aluno, para medir o balde e as vagas
    <<: *limits_default
    msgs_per_min: 1000000
    tokens_per_day: 1000000000
    turns_in_flight: 1000000
    global_ceiling_usd: 1000000
    degrade_at: null
targets:  # reajuste único da janela A (2026-11-04, claude-haiku-5-5, n=answer_call 390/overhead 300/tool_call 215)
  card: {p50: 3.5, p90: 3.22, p95: 6.0, p99: 5.04}
  "1": {p50: 3.62, p90: 4.79, p95: 8.0, p99: 6.54}
  "2+": {p50: 6.07, p90: 8.41, p95: 12.0, p99: 10.22}
ttfe:  # reajuste único da janela A (2026-11-04, claude-haiku-5-5, n=answer_call 390/overhead 300/tool_call 215)
  card: {p95: 6.0}
  "1": {p95: 4.0}
  "2+": {p95: 4.0}
graph_budget_s: 12.26  # reajuste único da janela A (2026-11-04, claude-haiku-5-5, n=answer_call 390/overhead 300/tool_call 215)
buckets: [0.5, 1, 2, 3, 4, 6, 8, 12, 16, 24]
turn_slots: 8
infra_overhead_p95_ms: 300
