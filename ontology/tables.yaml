# Destino de cada coluna das 47 tabelas de origem (spec 5.3 item 7). Chave = "<sistema>/<tabela>".
# Coluna: [destino, tipo, alvo, motivo]. destino: load | transform | resolution | discard.
# tipo: id | enum | text | date | instant | money | number | bool | code (tipo da coluna de origem).
# alvo: "<tabela canon>.<campo>" (campo declarado em entities.yaml); só load/transform têm alvo.
# O build só emite load/transform; resolution só alimenta ligações e regras; discard nunca sai do CSV.

sag/brand:
  destination: loaded
  reason: "catálogo por família: marca, modalidade e UF da sede"
  columns:
    BRAND: [load, code, brand.brand, "chave da marca"]
    BRAND_NAME: [discard, text, ~, "nome jurídico em caixa alta; a UI usa a família da marca"]
    MODALITY: [load, enum, brand.modality, "presencial ou EAD"]
    CNPJ: [discard, code, ~, "CNPJ nunca é carregado"]
    HQ_UF: [load, code, brand.hq_uf, "UF da sede, dado público"]
    ACTIVE: [load, bool, brand.active, "marca ativa"]

sag/unit:
  destination: loaded
  reason: "catálogo de unidades; só o rótulo da lista congelada de 27"
  columns:
    UNIT_ID: [load, id, unit.unit_id, "chave da unidade"]
    BRAND: [load, code, unit.brand, "marca da unidade"]
    UNIT_NAME: [transform, text, unit.label, "vira o rótulo da lista exata congelada"]
    UNIT_TYPE: [load, enum, unit.unit_type, "campus ou polo"]
    CITY: [discard, text, ~, "texto livre; o rótulo congelado já identifica a unidade"]
    UF: [load, code, unit.uf, "UF da unidade"]
    IBGE_CODE: [discard, code, ~, "sem pergunta de aluno"]
    OPENED_ON: [discard, date, ~, "sem pergunta de aluno"]

sag/course:
  destination: loaded
  reason: "catálogo global de cursos, com nome PT da ontologia"
  columns:
    COURSE: [load, id, course.course_id, "chave do curso"]
    COURSE_ACRONYM: [load, code, course.acronym, "sigla ligada ao produto e ao LMS"]
    COURSE_NAME: [transform, text, course.name_pt, "nome em inglês vira o nome PT congelado"]
    DEGREE: [load, enum, course.degree, "grau"]
    DURATION_SEMESTERS: [load, number, course.duration_semesters, "duração"]
    EMEC_CODE: [discard, code, ~, "código regulatório sem pergunta de aluno"]

sag/curriculum:
  destination: loaded
  reason: "catálogo global de matrizes curriculares"
  columns:
    CURRICULUM_ID: [load, id, curriculum.curriculum_id, "chave da matriz"]
    COURSE: [load, id, curriculum.course_id, "curso da matriz"]
    VALID_FROM_TERM: [load, code, curriculum.valid_from_term, "início de vigência"]
    VALID_TO_TERM: [load, code, curriculum.valid_to_term, "fim de vigência"]
    TOTAL_HOURS: [load, number, curriculum.total_hours, "carga total"]
    STATUS: [load, enum, curriculum.status, "vigente ou legada"]

sag/subject:
  destination: loaded
  reason: "catálogo global de disciplinas; name_pt obrigatório"
  columns:
    SUBJECT_CODE: [load, id, subject.subject_code, "chave da disciplina"]
    SUBJECT_NAME: [transform, text, subject.name_pt, "nome em inglês vira o nome PT congelado"]
    HOURS: [load, number, subject.hours, "carga horária"]
    CREDITS: [load, number, subject.credits, "créditos"]
    SUBJECT_TYPE: [load, enum, subject.subject_type, "tipo da disciplina"]

sag/curriculum_subject:
  destination: loaded
  reason: "disciplinas por matriz: semestre, obrigatoriedade e pré-requisito"
  columns:
    CURRICULUM_ID: [load, id, curriculum_subject.curriculum_id, "matriz"]
    SUBJECT_CODE: [load, id, curriculum_subject.subject_code, "disciplina"]
    SEMESTER: [load, number, curriculum_subject.semester, "semestre da matriz"]
    MANDATORY: [load, bool, curriculum_subject.mandatory, "obrigatória"]
    PREREQUISITE_CODE: [load, id, curriculum_subject.prerequisite_code, "pré-requisito"]

sag/course_offer:
  destination: loaded
  reason: "oferta por unidade e curso; modalidade vem da marca da unidade"
  columns:
    OFFER_ID: [load, id, course_offer.offer_id, "chave da oferta"]
    UNIT_ID: [load, id, course_offer.unit_id, "unidade"]
    COURSE: [load, id, course_offer.course_id, "curso"]
    CURRICULUM_ID: [load, id, course_offer.curriculum_id, "matriz"]
    SHIFT: [load, enum, course_offer.shift, "turno"]
    SEATS: [discard, number, ~, "capacidade interna"]
    FIRST_TERM: [discard, code, ~, "sem pergunta de aluno"]

sag/term:
  destination: loaded
  reason: "calendário global: período e início de AV1/AV2"
  columns:
    TERM: [load, code, term.term, "semestre AAAA/S"]
    START_DATE: [load, date, term.start_date, "início do semestre"]
    END_DATE: [load, date, term.end_date, "fim do semestre"]
    AV1_START: [load, date, term.av1_start, "início da AV1"]
    AV2_START: [load, date, term.av2_start, "início da AV2"]
    IS_CURRENT: [load, bool, term.is_current, "semestre corrente"]

sag/enrollment:
  destination: loaded
  reason: "matrícula do aluno, ligada por (marca, RA); sem dado pessoal"
  columns:
    BRAND: [load, code, enrollment.brand, "marca"]
    STUDENT_ID: [load, code, enrollment.ra, "RA do próprio aluno (a chave de ligação usa marca + RA)"]
    PERSON_ID: [resolution, id, ~, "serve só para ligar à pessoa; a chave humana é o CPF"]
    COURSE: [load, id, enrollment.course_id, "curso"]
    CURRICULUM_ID: [load, id, enrollment.curriculum_id, "matriz"]
    UNIT_ID: [transform, id, enrollment.unit_label, "vira o rótulo da lista congelada de unidades"]
    MODALITY: [load, enum, enrollment.modality, "modalidade"]
    SHIFT: [load, enum, enrollment.shift, "turno"]
    ENTRY_TYPE: [load, enum, enrollment.entry_type, "forma de ingresso"]
    DATE_OF_ENROLLMENT: [load, date, enrollment.enrolled_on, "data da matrícula"]
    ENTRY_TERM: [load, code, enrollment.entry_term, "semestre de ingresso"]
    SEMESTER: [load, number, enrollment.semester, "semestre cursado"]
    CURRENT_CURRICULUM_COMPLETION: [load, number, enrollment.completion_pct, "conclusão 0-100"]
    GPA: [load, number, enrollment.gpa, "CR armazenado; não recalcular"]
    ENROLLMENT_STATUS: [load, enum, enrollment.status, "SAG decide o status acadêmico"]
    STATUS_DATE: [load, date, enrollment.status_date, "data do status"]
    ORIGIN_BRAND: [load, code, enrollment.origin_brand, "marca de origem da transferência"]
    ORIGIN_STUDENT_ID: [resolution, code, ~, "liga à matrícula de origem; RA de outra marca não é exibido"]
    UPDATED_AT: [discard, instant, ~, "carimbo técnico sem fuso"]

sag/enrollment_status_history:
  destination: loaded
  reason: "eventos de status da matrícula, sem CHANGED_BY"
  columns:
    HISTORY_ID: [discard, id, ~, "chave técnica"]
    BRAND: [resolution, code, ~, "liga à matrícula"]
    STUDENT_ID: [resolution, code, ~, "liga à matrícula"]
    TERM: [load, code, enrollment_event.term, "semestre do evento"]
    EVENT_DATE: [load, date, enrollment_event.event_date, "data do evento"]
    OLD_STATUS: [load, enum, enrollment_event.old_status, "status anterior"]
    NEW_STATUS: [load, enum, enrollment_event.new_status, "status novo"]
    REASON: [load, enum, enrollment_event.reason, "motivo, rotulado em PT"]
    PROTOCOL_REF: [transform, code, enrollment_event.protocol_ref, "PRT-AAAA/NNNNNNN vira 11 dígitos"]
    CHANGED_BY: [discard, code, ~, "login de funcionário nunca é carregado"]

sag/term_enrollment:
  destination: loaded
  reason: "rematrícula por semestre; o status da matrícula prevalece"
  columns:
    BRAND: [resolution, code, ~, "liga à matrícula"]
    STUDENT_ID: [resolution, code, ~, "liga à matrícula"]
    TERM: [load, code, term_enrollment.term, "semestre"]
    SEMESTER_LEVEL: [load, number, term_enrollment.semester_level, "período cursado"]
    REGISTRATION_DATE: [load, date, term_enrollment.registration_date, "data da rematrícula"]
    TERM_STATUS: [load, enum, term_enrollment.term_status, "situação da rematrícula"]
    CREDITS_ENROLLED: [load, number, term_enrollment.credits_enrolled, "créditos"]

sag/student_class:
