  columns:
    CLASS_ID: [load, id, class_result.class_id, "turma; disciplina, semestre e professor vêm de class_section"]
    BRAND: [resolution, code, ~, "liga à matrícula"]
    STUDENT_ID: [resolution, code, ~, "liga à matrícula"]
    CURRICULUM_ID: [load, id, class_result.curriculum_id, "matriz"]
