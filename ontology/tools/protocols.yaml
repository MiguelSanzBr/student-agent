# Campos de saída declarados por ferramenta (T7 cria vazio; as tarefas 16-19 preenchem).
tools:
  list_protocols:
    outputs: [protocolos, protocolo, servico, status, aberto_em, prazo, solicitante, total, mensagem, nota_cobertura]
  get_protocol:
