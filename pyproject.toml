[project]
name = "student-agent"
version = "0.1.0"
description = "Agente de atendimento ao aluno"
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-genai>=2.34,<2.35",
  "langgraph>=1.2,<1.3",
  "a2a-sdk[http-server]>=1.3,<1.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "psycopg[binary,pool]>=3.2,<4",
  "redis>=5",
  "pydantic-settings>=2.16,<3",
  "pyyaml>=6",
  "pyjwt>=2.9",
  "structlog>=24",
  "prometheus-client>=0.20",
  "jsonschema>=4.23",
  "opentelemetry-api==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "openinference-semantic-conventions==0.1.43",
  "arize-phoenix-otel==0.17.2",
  "arize-phoenix-client==3.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "fakeredis>=2.26",
  "hypothesis>=6.100",
  "ruff>=0.8",
  "mypy>=1.13",
  "types-pyyaml",
  "types-jsonschema",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m \"not live\""
markers = ["live: chama o Gemini de verdade (pulado sem GEMINI_API_KEY)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["core", "etl", "app", "scripts"]
